<main style="max-width: 720px; margin: 64px auto; padding: 0 24px;">
  <h1 style="margin-bottom: 12px;">KurzusRadar</h1>
  <p style="margin-bottom: 24px; color: var(--text-secondary);">
    Landing oldal előkészítve. A következő lépésben építjük fel a teljes bemutató felületet.
  </p>
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <button type="button" class="btn btn-primary" (click)="launchDemo()">
      Élő demó kipróbálása
    </button>
    <a routerLink="/auth/register" class="btn btn-secondary">Regisztráció</a>
    <a routerLink="/auth/login" class="btn btn-ghost">Bejelentkezés</a>
  </div>
</main>
